<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>SSAFY AI 챗봇</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <div class="app-container">
      <div class="header">
        <span>SSAFY 규정 봇</span>
        <div>
          <button class="upload-btn" onclick="toggleUpload()">문서 추가</button>
          <button class="upload-btn reset-btn" onclick="resetDatabase()" style="background-color: #dc3545; margin-left: 5px">DB 초기화</button>
        </div>
      </div>

      <!-- 업로드 패널 -->
      <!-- ※ Step 2 핵심: JS 없이 HTML form으로 파일 업로드! -->
      <div id="upload-panel" class="upload-panel">
        <div class="upload-content">
          <p>새 문서를 업로드하면 챗봇이 해당 내용도 학습합니다.</p>
          <p class="file-types">지원 형식: .txt, .md, .pdf</p>

          <input type="file" accept=".txt,.md,.pdf" required />
          <button>업로드</button>
        </div>
      </div>

      <div id="chat-window" class="chat-window">
        <div class="message bot">안녕하세요! 궁금한 점을 물어보세요.</div>
      </div>

      <div class="input-area">
        <input type="text" id="user-input" placeholder="질문을 입력하세요..." />
        <label class="rag-checkbox-label"> <input type="checkbox" id="rag-toggle" /> RAG </label>
        <button onclick="sendMessage()">전송</button>
      </div>
    </div>
    <script src="script.js"></script>
  </body>
</html>
